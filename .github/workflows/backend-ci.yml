name: Backend CI

# Separate from flutter-ci.yml on purpose, same reasoning as the sibling
# microservices repo — Go and Dart/Flutter are unrelated toolchains, no
# reason to couple their pipelines. Much simpler than that repo's
# backend-ci.yml because this backend is one Go module (ADR-001; see
# docs/plans/01-phase1-scaffold-gateway-auth.md Step 0), not six — one
# build/vet/lint/test pass at the module root instead of a loop over six
# service directories.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Read-only by default (#95). Nothing here pushes, comments or publishes, so
# a compromised step or dependency gets a token that cannot write to the
# repository. A job that ever needs more should ask for it on its own.
permissions:
  contents: read

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    # Backs any integration tests that need a real Postgres (mirrors the
    # image the sibling repo's docker-compose.yml and CI both use). No redis
    # service — rate limiting is in-memory in this backend (ADR-001 §5), so
    # nothing here needs it.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: monolith_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d monolith_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Picked up by this backend's requirePostgres helper — with the
      # container healthy, integration tests run for real instead of
      # skipping.
      #
      # The harness derives its own database from this URL and creates it
      # (monolith_db_test, see db.EnsureTestDatabase). CI has no application
      # attached to this Postgres, so isolation is not strictly required
      # here — but using the same code path locally and in CI is what stops
      # "works in CI, flaky on a laptop" from being a category of bug.
      DATABASE_URL: postgres://app:app@localhost:5432/monolith_db?sslmode=disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned, not a floating channel — same lesson already learned and
      # documented in the sibling repo's flutter-ci.yml: an unpinned
      # toolchain silently drifts to whatever's current on the day CI runs.
      # Keep this in step with backend/go.mod's own go directive.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Lint
        working-directory: backend
        run: golangci-lint run ./...

      # Known vulnerabilities in Go itself or a dependency (#95) — but only
      # on code paths this backend actually calls, so it fails on what is
      # reachable, not on every advisory in the module graph. Bump the Go
      # version above (and in both Dockerfiles) when it flags the standard
      # library.
      - name: Vulnerability check
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      # Insecure patterns in our own code (#95). Fails on any finding.
      #
      # G115 (integer conversions) is excluded, after review on 2026-10-22:
      # its 64 sites all convert a value already bounded — validated input
      # (capacity 1-20, scores 1-5), the server-signed trust level (0-4), or
      # a compile-time batch size. The one that was NOT bounded, query-string
      # page_size and within_days, was fixed by parsing as 32-bit. Five
      # reviewed false positives carry `#nosec` with the reason beside them.
      - name: Security lint
        working-directory: backend
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.8
          gosec -quiet -exclude-generated -exclude=G115 ./...

      # -race is not optional here: this backend runs seven concurrent
      # background loops alongside request handling — the meetup lifecycle
      # poller, three outbox pollers (notification, meetups-completed and
      # user-deleted), their two retention sweeps, and the refresh-token /
      # guest / safety-hold sweeper — and several tests deliberately
      # exercise concurrent claimers. A data race in that code is exactly
      # the kind of defect that passes a serial test run and fails in
      # production.
      #
      # Keep the count honest when a loop is added: it is the justification
      # for this flag, and a stale number quietly erodes the reason anyone
      # keeps paying for it.
      #
      # -coverprofile (§D6): coverage was previously not merely unenforced
      # but entirely unmeasured. The profile is uploaded as an artifact
      # below; a threshold gate can come later, once there is a baseline
      # number to set one from.
      - name: Test
        working-directory: backend
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        working-directory: backend
        run: |
          go tool cover -func=coverage.out | tail -1
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage.html
          retention-days: 14

  # Generated code is COMMITTED in this repo (so a fresh clone builds
  # without sqlc, buf or the protoc plugins), which means it can silently
  # fall out of step with the .sql and .proto files it came from. Nothing
  # else here would notice: a stale sqlcgen file compiles, passes vet, lints
  # clean and runs — it just runs the OLD query. This job is the only thing
  # that would catch "edited the query, forgot to regenerate".
  #
  # Every generator is pinned to the version recorded in the committed
  # output's own header (sqlc.yaml/buf.gen.yaml do not pin them), because a
  # different generator version reformats files it did not otherwise change
  # and would fail this check for no real reason.
  # Secrets committed to git (#95). This repository is public, so a leak is
  # exposure the moment it is pushed. Scans the full history; the reviewed
  # allowlist is .gitleaks.toml.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan history for secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.28.0 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner

  generated-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"

      - name: Install the generators
        run: |
          set -euo pipefail
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install github.com/bufbuild/buf/cmd/buf@v1.72.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Regenerate
        working-directory: backend
        run: |
          set -euo pipefail
          sqlc generate
          buf generate

      - name: Fail if the committed output is stale
        run: |
          set -euo pipefail
          if ! git diff --quiet -- backend/internal; then
            echo "Generated code does not match its sources. Run 'sqlc generate' and 'buf generate' in backend/ and commit the result."
            echo
            git diff --stat -- backend/internal
            git diff -- backend/internal | head -200
            exit 1
          fi
          echo "OK: sqlc and buf output matches the committed files"

  # §D5: builds both images. The Go job above compiles the binaries but never
  # exercised a Dockerfile, so a wrong COPY path, a wrong ENTRYPOINT, or a
  # build-context assumption that broke would pass CI green and surface for
  # the first time at deploy. Separate job because it shares nothing with the
  # test job (no Postgres, no Go toolchain) and can run in parallel with it.
  #
  # No push. The point is only to prove both images build from a clean
  # context — publishing is a deployment concern this repo does not have yet.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build monolith image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/cmd/monolith/Dockerfile
          push: false
          load: true
          tags: professional-meetups-monolith:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/cmd/gateway/Dockerfile
          push: false
          load: true
          tags: professional-meetups-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the ENTRYPOINT is actually runnable, which a successful build
      # does not. Both binaries exit non-zero on a missing required env var,
      # so a run that fails with the CONFIG error (rather than exec format
      # error / no such file) is what confirms the image is wired correctly.
      - name: Smoke-test both entrypoints
        run: |
          set -e
          for image in professional-meetups-monolith:ci professional-meetups-gateway:ci; do
            echo "--- $image ---"
            output=$(docker run --rm "$image" 2>&1 || true)
            echo "$output"
            if ! echo "$output" | grep -q "required environment variable"; then
              echo "FAIL: $image did not reach its own config validation — the entrypoint is not running the built binary"
              exit 1
            fi
          done

      # §D4: the .dockerignore is only useful if it actually excludes what it
      # claims to. This asserts secrets/ never entered the build context,
      # which is the failure that would matter and the one nobody would
      # notice on their own.
      - name: Assert secrets are excluded from the build context
        run: |
          set -e
          mkdir -p backend/secrets
          echo "FAKE-PRIVATE-KEY-CANARY" > backend/secrets/canary.pem
          docker build -f backend/cmd/monolith/Dockerfile -t context-check:ci --target build backend
          if docker run --rm context-check:ci ls /workspace/secrets 2>/dev/null; then
            echo "FAIL: secrets/ is present in the build context despite .dockerignore"
            exit 1
          fi
          echo "OK: secrets/ was excluded from the build context"
