name: Deploy backend

# Builds both images, applies migrations, and deploys a new Cloud Run
# revision (#95) — the same steps as docs/deploy/gcp-runbook.md §3, from a
# clean checkout instead of a laptop.
#
# MANUAL ONLY. Nothing deploys because a commit landed: someone presses Run
# workflow (Actions tab) and names the revision. Authentication is Workload
# Identity Federation through the same pool as the backup, whose condition
# admits only this repository's main branch, so a pull request or a fork
# cannot run this with Google credentials.
#
# Order is the safety: migrations run BEFORE the deploy. The monolith refuses
# to start against a schema older than it was built for (cmd/monolith/
# schema_check.go), so if migrations did not land the new revision never
# becomes ready and Cloud Run keeps serving the previous one.
#
# Needs the SUPABASE_DIRECT_URL secret the backup already uses (the session
# pooler URL, runbook §9) and the deployer service account (runbook §11).
#
# Two gates before anything is built (#95, #100):
#   - the job runs in the protected `production` environment, so it waits
#     for an approver and only main can use it (runbook §11);
#   - Backend CI must have passed on this exact commit.
#
# backend/service.yaml is not in git (it holds project identifiers and test
# allowlists). It is rendered here from docs/deploy/service.yaml.template
# with the `production` environment's secrets, checked by the manifest
# tests, and used once. scripts/render-service-yaml.sh refuses to render
# with a required value missing.

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Revision suffix, e.g. r38 (must be new)"
        required: true

permissions:
  contents: read
  id-token: write
  actions: read # to read Backend CI's result for this commit

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  REGION: asia-south1
  SERVICE: meetups-backend
  REPO: asia-south1-docker.pkg.dev/project-285b9289-549d-4fef-92c/meetups-repo
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/740861671089/locations/global/workloadIdentityPools/github/providers/github
  GCP_DEPLOY_SERVICE_ACCOUNT: deployer@project-285b9289-549d-4fef-92c.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the revision name
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          if ! [[ "$REVISION" =~ ^r[0-9]+[a-z]?$ ]]; then
            echo "revision must look like r38, got '$REVISION'" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "deploys run from main only, not $GITHUB_REF" >&2
            exit 1
          fi

      - name: Require a green Backend CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/backend-ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.total_count')"
          if [ "${passed:-0}" -lt 1 ]; then
            echo "Backend CI has not passed on $GITHUB_SHA; wait for it or fix it first" >&2
            exit 1
          fi

      - name: Render the service manifest
        working-directory: backend
        env:
          REVISION: ${{ inputs.revision }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          APPLE_SERVICES_ID: ${{ secrets.APPLE_SERVICES_ID }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          ANALYTICS_ARCHIVE_BUCKET: ${{ secrets.ANALYTICS_ARCHIVE_BUCKET }}
          ANALYTICS_REPORT_RECIPIENTS: ${{ secrets.ANALYTICS_REPORT_RECIPIENTS }}
          MIN_CREDITS_APP_VERSION: ${{ secrets.MIN_CREDITS_APP_VERSION }}
          MIN_SUPPORTED_APP_VERSION: ${{ secrets.MIN_SUPPORTED_APP_VERSION }}
          OTEL_EXPORTER: ${{ secrets.OTEL_EXPORTER }}
          APPLE_APP_STORE_ISSUER_ID: ${{ secrets.APPLE_APP_STORE_ISSUER_ID }}
          APPLE_APP_STORE_KEY_ID: ${{ secrets.APPLE_APP_STORE_KEY_ID }}
          GOOGLE_PUBSUB_PUSH_AUDIENCE: ${{ secrets.GOOGLE_PUBSUB_PUSH_AUDIENCE }}
          GOOGLE_PUBSUB_PUSH_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PUBSUB_PUSH_SERVICE_ACCOUNT }}
          TEST_OTP_BYPASS_PHONES: ${{ secrets.TEST_OTP_BYPASS_PHONES }}
          TEST_OTP_BYPASS_EMAILS: ${{ secrets.TEST_OTP_BYPASS_EMAILS }}
        run: scripts/render-service-yaml.sh service.yaml

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.10"

      # The same checks CI runs on the template, now on the rendered file:
      # free tier, the silent-failure settings, every production setting.
      - name: Check the rendered manifest
        working-directory: backend
        run: go test ./cmd/monolith -run 'Manifest|Template|Render' -count=1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push images
        working-directory: backend
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker buildx build --platform linux/amd64 -f cmd/monolith/Dockerfile -t "$REPO/monolith:$REVISION" --push .
          docker buildx build --platform linux/amd64 -f cmd/gateway/Dockerfile  -t "$REPO/gateway:$REVISION"  --push .

      # Over the session pooler: golang-migrate holds a session advisory lock,
      # which the 6543 transaction pooler cannot keep, and the free tier's
      # direct host is IPv6-only, which these runners do not have.
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "SUPABASE_DIRECT_URL is not set (runbook §9)" >&2
            exit 1
          fi
          docker run --rm -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1@sha256:de154de4b7f9d0d751aacb1ec6023f5fc96f874eb88b65d050f761a33376aa4b -path=/migrations -database "$DATABASE_URL" up

      - name: Deploy the revision
        working-directory: backend
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          grep -E "name: ${SERVICE}-${REVISION}|gateway:${REVISION}|monolith:${REVISION}" service.yaml
          gcloud run services replace service.yaml --region "$REGION"
          rm -f service.yaml

      - name: Confirm it is serving
        run: |
          url="$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')"
          serving="$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.traffic[0].revisionName)')"
          echo "serving: $serving"
          [ "$serving" = "${SERVICE}-${{ inputs.revision }}" ] || { echo "traffic is not on the new revision" >&2; exit 1; }
          for i in 1 2 3 4 5; do
            if curl -fsS "$url/readyz"; then echo; exit 0; fi
            sleep 6
          done
          echo "/readyz did not answer" >&2
          exit 1
