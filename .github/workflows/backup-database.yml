name: Database backup

# Nightly pg_dump of the production Supabase database to Google Cloud
# Storage (ADR-007, Plan 20 Fix 2, Plan 28 #95). The free tier has no
# managed backups, so this workflow is the backup.
#
# Authentication is Workload Identity Federation: GitHub mints a short-lived
# OIDC token, Google exchanges it for a ~1 hour access token. There is no
# JSON service-account key, so there is no long-lived credential in this
# repository's secrets to leak or to expire silently.
#
# The only secret this needs is SUPABASE_DIRECT_URL (the direct, NOT pooler,
# connection URL, which contains the database password). The bucket, the
# provider and the service account below are resource identifiers, not
# secrets; access is gated by the provider's attribute condition, which
# admits only this repository on this branch.
#
# Run backend/scripts/setup-backup-infra.sh once to create the bucket, the
# service account and the federation (docs/deploy/gcp-runbook.md §9).
#
# A failed run opens a GitHub issue. Between 2026-09-25 and 2026-10-22 this
# workflow failed 27 times in a row without anyone noticing, and the database
# was lost while those failures sat unread. A backup nobody is told about is
# not a backup.

on:
  schedule:
    # 18:00 UTC daily (23:30 in Colombo), a quiet hour for the app; the
    # meetup lifecycle poller's 60 s cadence has no interaction with a
    # read-only dump.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # mint the OIDC token Google exchanges
  issues: write # open the alert issue when a run fails

env:
  BACKUP_GCS_BUCKET: meetups-db-backups-740861671089
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/740861671089/locations/global/workloadIdentityPools/github/providers/github
  GCP_BACKUP_SERVICE_ACCOUNT: db-backup@project-285b9289-549d-4fef-92c.iam.gserviceaccount.com

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pg_dump must be at least the server's major version (Postgres 17 on
      # Supabase, runbook §6); an older client refuses to dump a newer
      # server. Ubuntu's own package lags, so install from PGDG.
      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      # Fail here with a clear message rather than deep inside the dump
      # script, where a missing secret reads as a connection error.
      - name: Check the database URL secret is set
        env:
          SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          if [ -z "${SUPABASE_DIRECT_URL}" ]; then
            echo "SUPABASE_DIRECT_URL is not set in this repository's Actions secrets." >&2
            echo "See docs/deploy/gcp-runbook.md §9." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_BACKUP_SERVICE_ACCOUNT }}

      # Provides gsutil on PATH, authenticated by the step above.
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Dump and upload
        env:
          SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
          BACKUP_GCS_BUCKET: ${{ env.BACKUP_GCS_BUCKET }}
        run: backend/scripts/backup-database.sh

      # The upload step already reads its own object back. This checks the
      # other half: that the bucket holds a backup from today, which is what
      # someone restoring actually depends on.
      - name: Confirm today's backup is in the bucket
        env:
          BACKUP_GCS_BUCKET: ${{ env.BACKUP_GCS_BUCKET }}
        run: |
          set -euo pipefail
          today="$(date -u +%Y%m%d)"
          if ! gsutil ls "gs://${BACKUP_GCS_BUCKET}/backup-${today}T"*.dump >/dev/null 2>&1; then
            echo "no backup dated ${today} in gs://${BACKUP_GCS_BUCKET}" >&2
            exit 1
          fi
          echo "bucket holds:"
          gsutil ls -l "gs://${BACKUP_GCS_BUCKET}/" | tail -5

      # The alert. One open issue at a time: a nightly job that fails for a
      # week should not file seven issues, and it must not go quiet either.
      - name: Open an issue if the backup failed
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Database backup failed';
            const body = [
              `The nightly database backup failed.`,
              ``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Supabase's free tier has no managed backups, so until this is`,
              `fixed the production database has no recovery point.`,
              ``,
              `Runbook: docs/deploy/gcp-runbook.md §9.`,
            ].join('\n');

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'backup-failure',
            });

            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['backup-failure'],
              });
            }
