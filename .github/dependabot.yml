# Dependency updates (#95). Weekly, grouped so a week's minor and patch
# bumps arrive as one pull request per ecosystem rather than a dozen, and
# capped so a backlog never floods the queue. Security updates are separate
# and arrive as soon as GitHub knows about them, regardless of this schedule.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]

  # Keeps the SHA-pinned actions current: Dependabot rewrites the pin and the
  # "# vN" comment beside it together.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend/cmd/monolith
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /backend/cmd/gateway
    schedule: { interval: weekly }
