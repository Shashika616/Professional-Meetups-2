<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="professional_connections_platform">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>professional_connections_platform</title>
  <link rel="manifest" href="manifest.json">

  <!--
    ADR-032 round 2 — pinned bottom nav bar on mobile web.

    Without this, html/body size to their content rather than the viewport,
    so on iOS Safari the whole document scrolls as ordinary page content as
    the dynamic address bar grows/shrinks. Flutter's Scaffold.bottomNavigationBar
    is only pinned within Flutter's own view, so when that view is taller
    than the visible viewport the nav bar scrolls away with the page — which
    is exactly the reported symptom (a nav bar that doesn't stay put on a
    mobile Safari screenshot).

    Locking html/body to exactly the viewport height with overflow: hidden
    keeps Flutter's canvas the size of the visible area, so the bar stays
    put. viewport-fit=cover is what makes iOS report real safe-area insets
    (home indicator), which AppBottomBar's SafeArea then insets against.
    User scaling is deliberately NOT disabled — that would be an
    accessibility regression, and it isn't needed for the fix.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
