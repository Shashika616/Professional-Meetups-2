name: professional_connections_platform
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  riverpod: ^3.4.2

  # LinkedIn OAuth (PKCE) session flow — ADR-011 frontend slice.
  flutter_secure_storage: ^9.2.4 # Keychain/Keystore-backed token storage (ADR-009)
  http: ^1.5.0 # REST calls to the gateway
  app_links: ^6.4.1 # receives the professionalconnections:// redirect
  url_launcher: ^6.3.2 # opens LinkedIn's auth URL in the system browser
  crypto: ^3.0.6 # SHA-256 for the PKCE code_challenge

  # Schedule flow's location step (frontend/meetup-scheduling-PLAN.md's
  # 2026-08-18 testing addendum). maplibre_gl, not mapbox_maps_flutter — a
  # deliberate divergence from ADR-013's original dependency list, only for
  # this Stadia-Maps-backed testing pass (see TESTING-NOTES.md). Do not add
  # mapbox_maps_flutter alongside this speculatively.
  maplibre_gl: ^0.26.2
  # Pinned to 14.0.2, not the newest 14.0.3 — 14.0.3's transitive
  # package_info_plus/win32 bump conflicts with flutter_secure_storage's
  # own win32 constraint (this app has no Windows target, but pub still
  # resolves across all platforms a federated plugin declares).
  geolocator: ^14.0.2 # "Use my current location" on the same step
  # iOS-only map rendering (ADR-013 §4's third correction, frontend/
  # meetup-scheduling-PLAN.md's 2026-08-18 platform-split addendum) —
  # Apple MapKit, no API key/billing, settled as the iOS decision (not
  # provisional like Android's Stadia choice). Search/autocomplete isn't
  # exposed by this package (MapKit rendering only) — that's wired
  # separately via a small native MethodChannel to MKLocalSearchCompleter/
  # MKLocalSearch, see ios/Runner/LocalSearchChannel.swift.
  apple_maps_flutter: ^1.4.0

  # Level 0 federated identity (ADR-014): account creation via Sign in
  # with Apple (iOS) / Google Sign-In (Android) instead of LinkedIn-only.
  # Versions confirmed against pub.dev at implementation time (2026-08-19),
  # not the older ones named in frontend/level0-federated-identity-PLAN.md's
  # own Step 1 — that plan explicitly says to reconfirm latest rather than
  # use its numbers verbatim.
  sign_in_with_apple: ^8.1.0
  google_sign_in: ^7.2.0

  # Persists the light/dark theme toggle (Slice G) across app restarts —
  # not a dependency anywhere else in this app before this.
  shared_preferences: ^2.5.3

  # Real push notifications (ADR-030, round-10) — swaps
  # NoOpPushNotificationService for a real FirebasePushNotificationService
  # behind the same PushNotificationService interface Round 9 built. Real
  # Firebase project already exists (professional-meetups-976d2);
  # google-services.json/GoogleService-Info.plist/firebase_options.dart are
  # already in place. Versions confirmed against pub.dev at implementation
  # time (2026-09-02) via `dart pub add`, not guessed.
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

  # Mobile Premium purchase (ADR-031, Slice B) — wraps StoreKit2 (iOS) and
  # Google Play Billing (Android) behind one Dart API. Version confirmed
  # against pub.dev at implementation time via `dart pub add`, not
  # guessed. No separate platform-specific purchase package added
  # alongside this.
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lets tests fake flutter_secure_storage's platform channel in-memory
  # instead of touching a real Keychain/Keystore (unavailable under `flutter
  # test`) — see test/session_storage_test.dart.
  flutter_secure_storage_platform_interface: ^1.1.2

  # Lets tests fake geolocator's platform channel (settable
  # GeolocatorPlatform.instance) instead of touching real device location
  # (unavailable under `flutter test`) — see
  # test/support/fake_geolocator_platform.dart, used by safety_page_test.dart.
  geolocator_platform_interface: ^4.2.8

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Swift Package Manager is on by default in this Flutter version, and
  # maplibre_gl ships a Package.swift that pulls its native SDK straight
  # from a public GitHub repo — Xcode then prompts every contributor to
  # sign in to GitHub during iOS builds, purely to raise the anonymous API
  # rate limit for that resolution. Disabled here (project-wide, checked
  # in, not a per-machine `flutter config` toggle) so maplibre_gl installs
  # through its CocoaPods podspec instead, the same route every other
  # plugin in this project already uses. After changing this, run
  # `flutter clean` before the next build.
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/watch/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
