syntax = "proto3";

package auth.v1;

option go_package = "professional-meetups-monolith/backend/internal/proto/auth/v1;authv1";

// AuthService is the auth module's half of the gateway<->monolith gRPC
// contract (ADR-001 §1 — that hop stays a real process boundary; only
// module-to-module calls *inside* the monolith are in-process Go calls).
// It is never exposed directly to clients — the gateway translates the
// public REST API into these calls.
//
// Ported from ../Professional-Meetups/backend/proto/auth/v1/auth.proto with
// exactly one deliberate contract change (ADR-001 §6): SessionResponse no
// longer carries a pre-signed access token. The monolith authenticates and
// returns identity facts; the GATEWAY holds the RSA private key and signs
// the access token itself. See SessionResponse below.
service AuthService {
  // Creates a Level 0 account, or logs in if this (provider, subject)
  // already has one (ADR-014). Unauthenticated — this is how a caller gets
  // their first token, via Sign in with Apple (iOS) or Google Sign-In
  // (Android) rather than LinkedIn, which is no longer required to create
  // an account at all. Verifies id_token against the provider's own
  // published JWKS (internal/identity) — no server-to-server code
  // exchange, unlike LinkedIn's flow below.
  //
  // Rejects with a clear, specific error if age_confirmed_over_18 is
  // false — the server enforces this regardless of what the client UI
  // showed; never trust the client to have actually displayed the
  // checkbox.
  rpc CompleteFederatedSignup(CompleteFederatedSignupRequest) returns (SessionResponse);

  // Creates a Level 1 account directly via LinkedIn, or logs in if this
  // linkedin_sub already has one — unchanged in behavior from ADR-011,
  // still unauthenticated, still the one path that grants Level 1
  // immediately (ADR-014 §1's "LinkedIn is the only path to Level 1,
  // whether chosen at signup or connected later"). The one addition:
  // age_confirmed_over_18 is now required and rejected server-side if
  // false, same as every other signup path — LinkedIn direct signup didn't
  // have an age gate before ADR-014 and needed one, since it's a
  // standalone account-creation path just like the other three. Internally
  // calls the same ResolveOrCreateIdentity every federated login uses
  // (ADR-014's Identity Resolution section) — not a separate lookup.
  // Deliberately no PKCE code_verifier: LinkedIn's Sign In with LinkedIn /
  // OpenID Connect product rejects the token exchange outright when
  // code_challenge/code_verifier are present (confirmed via manual curl
  // testing against LinkedIn's real endpoint — identical requests succeed
  // with PKCE omitted, fail with 401 invalid_client when included).
  // Security is still sound without it: this is a confidential client — the
  // LinkedIn client_secret lives only in this service, never in the mobile
  // app — which is what PKCE exists to substitute for on a public client
  // that can't hold a secret.
  rpc CompleteLinkedInOnboarding(CompleteLinkedInOnboardingRequest) returns (SessionResponse);

  // Links an additional identity to the CALLER's already-authenticated
  // account (ADR-014's "Connect LinkedIn" Profile flow, or a future
  // "add Apple/Google as backup sign-in") — gateway sets user_id from the
  // verified JWT, never client-supplied, same pattern as the Level 2/3
  // RPCs below. Calls the shared LinkIdentityToUser (ADR-014's Identity
  // Resolution section) which hard-rejects if (provider, subject) already
  // belongs to a DIFFERENT user — no silent account merge, the one real
  // abuse edge in this design. Returns a fresh SessionResponse since
  // linking LinkedIn bumps trust_level (linking Apple/Google never does,
  // ADR-014 §1, but the response shape is the same either way).
  //
  // The LinkedIn branch reuses authorization_code/redirect_uri (its flow
  // is authorization-code-based, never hands the mobile app an id_token,
  // unlike Apple/Google's native-SDK id_token flow) — kept on this one
  // generic message rather than a second RPC so the gateway has exactly
  // one authenticated "link an identity" route regardless of provider.
  rpc LinkIdentity(LinkIdentityRequest) returns (SessionResponse);

  // Email, OTP-only — no password anywhere, ever (ADR-019 §1, replacing
  // ADR-014 decision #2's email+password path). Signup requires OTP proof
  // of inbox control first — StartEmailSignup/CompleteEmailSignup reuse the
  // same verification_codes mechanism as phone/personal-email/
  // corporate-email (ADR-012), VERIFICATION_PURPOSE_EMAIL_SIGNUP, not a
  // second OTP subsystem. Unauthenticated — there is no user_id yet at
  // this point, the account may not even end up created (see
  // CompleteEmailSignup's recovery case).
  rpc StartEmailSignup(StartVerificationRequest) returns (StartVerificationResponse);
  // CompleteEmailSignup calls SignUpOrRecoverWithEmail internally — if
  // email already matches an existing user's VERIFIED personal_email, this
  // recovers that account rather than creating a duplicate; otherwise
  // creates a new Level 0 user. See SignUpOrRecoverWithEmail's own doc
  // comment for why recovery is the deliberate design here, not a bug.
  rpc CompleteEmailSignup(CompleteEmailSignupRequest) returns (SessionResponse);
  // GuestSignup creates a read-only guest account and returns a real session
  // for it (ADR-002 §3). No email, no phone, no LinkedIn — just the same
  // mandatory 18+ attestation every other signup path requires. The display
  // name is generated server-side and is never client-supplied.
  //
  // There is no matching "upgrade" RPC, deliberately: a guest who later
  // verifies anything does so through the existing verification RPCs, against
  // the same auth.users row, which flips is_guest to false on its own.
  rpc GuestSignup(GuestSignupRequest) returns (SessionResponse);
  // StartEmailLogin/CompleteEmailLogin (ADR-019 §1) are symmetric to
  // StartEmailSignup/CompleteEmailSignup in shape — a fresh
  // VERIFICATION_PURPOSE_EMAIL_LOGIN code, sent and verified the same
  // target-keyed way — but against an ALREADY-existing account. There is
  // no stored credential to check on a return visit anymore: every login
  // sends a fresh code. CompleteEmailLogin returns the same generic
  // "invalid email or code" error whether the email doesn't exist or the
  // code is wrong — an account-enumeration-safe pattern already used
  // elsewhere in this service (backend/ARCHITECTURE.md's error-mapping
  // rationale), replacing LoginWithPassword's now-removed equivalent.
  rpc StartEmailLogin(StartVerificationRequest) returns (StartVerificationResponse);
  rpc CompleteEmailLogin(VerifyCodeRequest) returns (SessionResponse);

  // Rotates a refresh token for a new access/refresh token pair. The
  // presented refresh token is invalidated as part of this call, whether or
  // not it was already valid — see ADR-009 on rotation-as-theft-detection.
  rpc RefreshSession(RefreshSessionRequest) returns (SessionResponse);

  // Revokes a refresh token (logout). Idempotent — revoking an
  // already-revoked or unknown token is not an error.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);

  // Level 2/3 verification (ADR-012, backend/PLAN.md's matching addendum).
  // Every RPC below requires an authenticated caller — the gateway extracts
  // user_id from the verified JWT and sets it explicitly on the request; a
  // client never supplies its own user_id. Verification-completing RPCs
  // return a fresh SessionResponse (new access token reflecting the
  // updated trust_level) rather than a bare success ack, so the caller
  // doesn't show a stale trust level until the next natural token refresh.
  rpc StartPhoneVerification(StartVerificationRequest) returns (StartVerificationResponse);
  rpc VerifyPhoneCode(VerifyCodeRequest) returns (SessionResponse);
  rpc StartPersonalEmailVerification(StartVerificationRequest) returns (StartVerificationResponse);
  rpc VerifyPersonalEmailCode(VerifyCodeRequest) returns (SessionResponse);
  rpc SubmitPersonalDetails(SubmitPersonalDetailsRequest) returns (SessionResponse);
  rpc StartCorporateEmailVerification(StartVerificationRequest) returns (StartVerificationResponse);
  rpc VerifyCorporateEmailCode(VerifyCodeRequest) returns (SessionResponse);
  // GetProfile returns everything ProfilePage needs to render real
  // verification state — booleans/derived fields only, never a raw phone
  // number or email address (Verification Model § 1's "never reveal a
  // user's full phone number" rule, extended to personal/corporate email
  // here too).
  rpc GetProfile(GetProfileRequest) returns (ProfileResponse);

  // CompleteProfileSetup (ADR-019 §2) is the new mandatory post-auth
  // screen's backend support, called once by every one of the four
  // sign-up/login paths right after auth succeeds. full_name is always
  // required and always settable here — the one field an email-OTP
  // account has no external source for, and that Apple/Google/LinkedIn
  // users can edit before confirming. company_name/company_email are
  // optional as a pair; if company_email is set, this RPC kicks off the
  // same corporate-email verification-start flow StartCorporateEmailVerification
  // uses (a fresh OTP is sent) rather than duplicating that logic — the
  // frontend's own "Verify" sub-step is what actually completes it, via
  // VerifyCorporateEmailCode. This RPC does not itself mark work email
  // verified. Authenticated — the gateway sets user_id from the verified
  // JWT, same as every RPC below GetProfile.
  rpc CompleteProfileSetup(CompleteProfileSetupRequest) returns (ProfileResponse);

  // UpdateLastKnownLocation (ADR-021 §4) — the browse screen's on-demand
  // location read is the only intended caller; self-only data, no
  // participant/trust-level gate. Publishes user-location-updated through
  // the outbox; auth never queries population-wide location data itself.
  rpc UpdateLastKnownLocation(UpdateLastKnownLocationRequest) returns (UpdateLastKnownLocationResponse);

  // Trusted contacts + SOS (ADR-026) — all four self-scoped via the
  // verified JWT's user_id, never a client-supplied one.
  rpc AddTrustedContact(AddTrustedContactRequest) returns (TrustedContactResponse);
  rpc ListTrustedContacts(ListTrustedContactsRequest) returns (ListTrustedContactsResponse);
  rpc RemoveTrustedContact(RemoveTrustedContactRequest) returns (RemoveTrustedContactResponse);
  // TriggerSOS looks up the caller's trusted contacts and alerts each one
  // directly (SmsSender/EmailSender's new SendAlert, not Notification
  // Dispatch — a trusted contact isn't necessarily a registered app user).
  // Rejects with InvalidArgument if the caller has zero trusted contacts.
  rpc TriggerSOS(TriggerSOSRequest) returns (TriggerSOSResponse);
}

// IdentityProviderProto — LINKEDIN is valid for LinkIdentityRequest (the
// Profile "Connect LinkedIn" flow) but never for CompleteFederatedSignup,
// which only ever accepts APPLE/GOOGLE (LinkedIn's own direct-signup path
// is CompleteLinkedInOnboarding, unchanged from ADR-011, not this RPC).
enum IdentityProviderProto {
  IDENTITY_PROVIDER_UNSPECIFIED = 0;
  IDENTITY_PROVIDER_APPLE = 1;
  IDENTITY_PROVIDER_GOOGLE = 2;
  IDENTITY_PROVIDER_LINKEDIN = 3;
}

message CompleteFederatedSignupRequest {
  IdentityProviderProto provider = 1;
  string id_token = 2;
  bool age_confirmed_over_18 = 3;
  // nonce is a DELIBERATE ADDITION over the sibling repo's contract, not a
  // port — it closes the id_token replay window the source leaves open by
  // never checking this claim (docs/security-review-framework.md,
  // Authenticity). Required: an empty value is rejected, never treated as
  // "skip the check".
  //
  // IT IS THE PRE-IMAGE, NOT THE CLAIM VALUE. The client generates a random
  // value, hands the provider SHA-256(value) as the sign-in request's nonce
  // (which is what Apple/Google embed in the id_token), and sends the RAW
  // value here. The server hashes it and compares.
  //
  // Sending the claim value itself would make the check decorative: a JWT's
  // nonce claim is readable by anyone holding the token, so an attacker who
  // obtained an id_token could read it out and submit it right back. The
  // pre-image is what they cannot produce. Same construction Apple documents
  // for Sign in with Apple and that Firebase's own
  // OAuthProvider.credential(idToken:rawNonce:) uses.
  string nonce = 4;
}

message CompleteLinkedInOnboardingRequest {
  string authorization_code = 1;
  string redirect_uri = 2;  // must exactly match the URI used to start the flow
  bool age_confirmed_over_18 = 3;
  reserved 4;                // was pkce_verifier — see AuthService's comment above for why PKCE was dropped
  reserved "pkce_verifier";
}

message LinkIdentityRequest {
  string user_id = 1;              // set by gateway from verified JWT
  IdentityProviderProto provider = 2;
  string id_token = 3;             // Apple/Google branch: native-SDK id_token, verified via internal/identity
  // LinkedIn branch: its flow is authorization-code, not a native-SDK
  // id_token like Apple/Google, so it needs its own pair of fields on this
  // one generic message rather than a second RPC.
  string authorization_code = 4;
  string redirect_uri = 5;         // must exactly match the URI used to start the flow
  // nonce accompanies id_token on the Apple/Google branch, exactly as on
  // CompleteFederatedSignupRequest above — the raw pre-image, not the
  // token's claim value. Ignored on the LinkedIn branch, which has no
  // id_token to bind it to and is protected by its own state parameter
  // instead.
  string nonce = 6;
}

// GuestSignupRequest carries only the age attestation — a guest supplies
// nothing else, by design.
message GuestSignupRequest {
  bool age_confirmed_over_18 = 1;
}

message CompleteEmailSignupRequest {
  string email = 1;
  string code = 2;            // the OTP just verified via StartEmailSignup
  reserved 3;                 // was password (argon2id-hashed) — ADR-019 §1 removed it entirely, no external client depends on this field
  reserved "password";
  bool age_confirmed_over_18 = 4;
}

// SessionResponse is what every session-issuing RPC returns. ADR-001 §6:
// there is deliberately no access_token field here (fields 2 and 4 are
// reserved, not reused) — the monolith never holds the JWT private key, so
// it cannot mint one. It returns the identity facts the gateway needs to
// sign a token itself: user_id and trust_level become the JWT's two custom
// claims, and the gateway fills access_token/expires_in into its own REST
// response afterwards.
//
// refresh_token IS still returned by the monolith (the raw value, exactly
// once) — unlike the access token, a refresh token is a database row this
// module owns and rotates (auth.refresh_tokens); only its SHA-256 hash is
// ever stored, so the raw value has to come back from whoever generated it.
// See docs/plans/01-phase1-scaffold-gateway-auth.md Step 3, which specifies
// this field precisely ("the new refresh-token row's raw value").
message SessionResponse {
  string user_id = 1;
  reserved 2;                 // was access_token — the gateway signs it now (ADR-001 §6)
  reserved "access_token";
  string refresh_token = 3;
  reserved 4;                 // was access_token_expires_in_seconds — derived from the gateway's own jwt.AccessTokenTTL now
  reserved "access_token_expires_in_seconds";
  bool is_new_user = 5;
  // full_name and profile_photo_url are the values captured from LinkedIn's
  // userinfo response at account creation (see internal/modules/auth's
  // CompleteLinkedInOnboarding) and already persisted on the user row —
  // returned here because there is no separate GET /v1/users/me endpoint
  // yet for a client to fetch them from afterward.
  string full_name = 6;
  string profile_photo_url = 7;
  // trust_level is new relative to the sibling repo's SessionResponse
  // (ADR-001 §6): the auth service used to put this claim into the token
  // itself, so it never had to travel over the wire. The gateway needs it
  // to build the same jwt.Claims{UserID, TrustLevel} pair the auth service
  // used to build internally — without it, every issued token would claim
  // trust level 0.
  int32 trust_level = 8;
}

message RefreshSessionRequest {
  string refresh_token = 1;
}

message RevokeSessionRequest {
  string refresh_token = 1;
}

message RevokeSessionResponse {
  bool success = 1;
}

// VerificationPurpose is shared across phone/personal-email/corporate-email
// — one OTP mechanism, three purposes (backend/PLAN.md's addendum, Step
// C/D), not three separate mechanisms. Redundant with which RPC is called
// (StartPhoneVerification vs. StartPersonalEmailVerification, etc.) by
// design — the service layer asserts the two agree, catching a
// mismatched-purpose client bug rather than silently trusting the RPC
// choice alone.
enum VerificationPurpose {
  VERIFICATION_PURPOSE_UNSPECIFIED = 0;
  VERIFICATION_PURPOSE_PHONE = 1;
  VERIFICATION_PURPOSE_PERSONAL_EMAIL = 2;
  VERIFICATION_PURPOSE_CORPORATE_EMAIL = 3;
  // Email+password signup (ADR-014 decision #2) — StartEmailSignup is
  // unauthenticated, so StartVerificationRequest.user_id is always "" for
  // this purpose; the service layer routes it to the target-keyed
  // verification_codes methods instead (migration 0004), not the
  // userID-keyed ones the other three purposes use.
  VERIFICATION_PURPOSE_EMAIL_SIGNUP = 4;
  // Passwordless email login (ADR-019 §1) — StartEmailLogin is
  // unauthenticated, so StartVerificationRequest.user_id is always "" for
  // this purpose too; routed to the same target-keyed verification_codes
  // methods VERIFICATION_PURPOSE_EMAIL_SIGNUP uses, but verified against
  // an already-existing account (CompleteEmailLogin) rather than
  // creating/recovering one.
  VERIFICATION_PURPOSE_EMAIL_LOGIN = 5;
}

message StartVerificationRequest {
  string user_id = 1;  // set by the gateway from the verified JWT, never client-supplied
  VerificationPurpose purpose = 2;
  string target = 3;   // phone number (E.164) or email address to verify
}

// Intentionally near-empty — never echoes the code, or any indication of
// whether target already exists on another account (a user-enumeration
// leak). See backend/ARCHITECTURE.md for the full error-mapping rationale.
message StartVerificationResponse {
  int32 resend_after_seconds = 1;
}

message VerifyCodeRequest {
  string user_id = 1;
  VerificationPurpose purpose = 2;
  string target = 3;   // must match what StartVerification was called with
  string code = 4;
  // company_name is only meaningful for VERIFICATION_PURPOSE_CORPORATE_EMAIL
  // (ADR-019 §3) — the name-vs-domain cross-check against known_companies
  // this verification never had before; ignored for every other purpose.
  // Required in practice for corporate-email verification even though the
  // proto can't enforce that — VerifyCorporateEmailCode rejects an empty
  // value itself.
  string company_name = 5;
}

message SubmitPersonalDetailsRequest {
  string user_id = 1;
  string legal_name = 2;
  string address = 3;
}

message GetProfileRequest {
  string user_id = 1;  // set by the gateway from the verified JWT, never client-supplied
}

// ProfileResponse is returned only to the authenticated caller about their
// own account (GetProfileRequest.user_id is gateway-set from the verified
// JWT, never client-supplied — see GetProfile's implementation for the
// re-confirmed invariant). Verification Model § 1's "never reveal a user's
// full phone number **to other users**" rule was, before ADR-023, applied
// here as "never to anyone, including the owner" — an over-generalization
// the domain rule never actually required. ADR-023 §4 corrects that: four
// raw fields (phone_number, personal_email, legal_name, address) are now
// included below, visible only to the account's own owner via this one
// self-authenticated endpoint — no other endpoint and no other user ever
// sees them. Work email is a separate, stronger rule (ADR-003: never
// *stored* past the verification round-trip) and stays fully excluded —
// there is no raw work-email field here, for anyone, ever. full_name/
// profile_photo_url are already in SessionResponse but repeated here since
// this is the one endpoint a client can call any time to refresh its whole
// profile view, not just at sign-in.
message ProfileResponse {
  string user_id = 1;
  string full_name = 2;
  string profile_photo_url = 3;
  int32 trust_level = 4;
  bool phone_verified = 5;
  bool personal_email_verified = 6;
  bool personal_details_complete = 7;
  string company_domain = 8;
  bool work_email_verified = 9;
  // Post-meetup star rating aggregate (ADR-015,
  // docs/02-domain/domain-model.md § Rating) — read here from the same
  // users columns services/meetup writes to after SubmitRating.
  double rating_average = 10;
  int32 rating_count = 11;
  // Raw PII, self-view only — ADR-023 §4. Empty when unset, same
  // presence-means-verified convention the *_verified booleans already use.
  string phone_number = 12;
  string personal_email = 13;
  string legal_name = 14;
  string address = 15;
  // ADR-002: derived boolean, never the raw linkedin_sub. The client can no
  // longer infer this from trust_level >= 1 — after ADR-002 §2 that is true
  // for every real signup path, LinkedIn or not.
  bool linkedin_connected = 18;
  // ADR-002 §3: lets the client render guest chrome and route a guest to
  // signup rather than to the Level 2 checklist, without inferring it from
  // trust_level == 0 (a different question that only coincides today).
  bool is_guest = 16;
  // ADR-002 §2: the free-text organisation name, now part of the Level 3
  // condition alongside work_email_verified. Prefills the hosting-unlock
  // page when a company was registered once already.
  string company_name = 17;
  // How many meetups this user has actually completed — the profile's
  // "MEETUPS" figure, which was a hardcoded literal on the client until
  // this field existed. Read from auth.users.meetups_completed, a cache the
  // meetup module keeps current (auth/0005), same arrangement as
  // rating_average/rating_count above.
  int32 meetups_completed = 19;
}

message CompleteProfileSetupRequest {
  string user_id = 1;        // set by the gateway from the verified JWT, never client-supplied
  string full_name = 2;      // always required
  string company_name = 3;   // optional; only meaningful paired with company_email
  string company_email = 4;  // optional; if set, kicks off corporate-email verification-start (ADR-019 §2)
}

// 40km geo-visibility (ADR-021 §4).
message UpdateLastKnownLocationRequest {
  string user_id = 1; // set by the gateway from the verified JWT
  double lat = 2;
  double lng = 3;
}

message UpdateLastKnownLocationResponse {
  bool success = 1;
}

// Minimal real SOS + trusted contacts (ADR-026).
message AddTrustedContactRequest {
  string user_id = 1; // set by the gateway from the verified JWT
  string name = 2;
  // At least one of phone_number/email is required — enforced server-side,
  // mirroring the DB CHECK constraint (migration 0009).
  string phone_number = 3;
  string email = 4;
  // ADR-003 — set by the gateway from the verified JWT's trust_level claim,
  // never a client-supplied value. AddTrustedContact/TriggerSOS require
  // Level 2, the same floor as joining a meetup.
  int32 caller_trust_level = 5;
}

message TrustedContactResponse {
  string id = 1;
  string name = 2;
  string phone_number = 3;
  string email = 4;
  int64 created_at_unix_seconds = 5;
}

message ListTrustedContactsRequest {
  string user_id = 1; // set by the gateway from the verified JWT
}

message ListTrustedContactsResponse {
  repeated TrustedContactResponse contacts = 1;
}

message RemoveTrustedContactRequest {
  string user_id = 1;    // set by the gateway from the verified JWT
  string contact_id = 2;
}

message RemoveTrustedContactResponse {
  bool success = 1;
}

message TriggerSOSRequest {
  string user_id = 1;         // set by the gateway from the verified JWT
  string context_message = 2; // optional — meetup title/location/time, or empty
  double latitude = 3;
  double longitude = 4;
  // ADR-003 — see AddTrustedContactRequest.caller_trust_level.
  int32 caller_trust_level = 5;
}

message TriggerSOSResponse {
  // How many of the caller's trusted contacts were actually alerted —
  // individual send failures don't fail the whole call (ADR-026 §4), so
  // this may be less than the caller's total contact count.
  int32 contacts_notified = 1;
}
