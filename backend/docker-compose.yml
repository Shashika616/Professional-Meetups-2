name: professional-meetups-monolith-backend

# Local development stack for the modular-monolith backend (ADR-001, see
# ../docs/decisions/adr-001-modular-monolith-architecture.md). Two backend
# processes only — gateway and monolith — one Postgres, no Redis, no Pub/Sub
# emulator, no per-service databases. Contrast with
# ../../Professional-Meetups/backend/docker-compose.yml (the microservices
# version this is a parallel, independent rewrite of): that one runs 5
# backend containers + Postgres + Redis + a Pub/Sub emulator; this one runs
# 2 backend containers + Postgres, nothing else (ADR-001 §§4-5).

services:
  postgres:
    # postgis/postgis, not plain postgres — the meetup module (Phase 2) needs
    # the PostGIS extension for its geography columns, same reasoning as the
    # sibling microservices repo (see its own docker-compose.yml comment).
    # One database, multiple schemas (auth, meetup, billing) — ADR-001 §3 —
    # not one database per module.
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: monolith_db
    ports:
      # Host port is parameterized (container port is not) so this stack can
      # run at the same time as the sibling microservices repo's own
      # docker-compose stack, which binds the same default ports — Phase 5's
      # side-by-side parity pass needs both up simultaneously. Defaults are
      # unchanged; set POSTGRES_HOST_PORT in backend/.env to move it.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Resource limits (§D2). Generous rather than tuned — the point is that a
    # ceiling EXISTS, so a runaway query or a leak degrades one container
    # instead of exhausting the host and taking the whole stack (including
    # Docker itself) with it. Compose v2 honours these on `docker compose up`;
    # raise them if a real workload needs it, but do not remove them.
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      # -h 127.0.0.1 is load-bearing on a fresh volume, not decoration — see
      # the sibling repo's docker-compose.yml for the full explanation (a
      # socket-based check reports "healthy" during Postgres's init-only
      # phase, before it's actually listening on TCP, which is what every
      # dependent below needs).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-app} -d monolith_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies every migration under backend/migrations/ against
  # monolith_db (schema-qualified — e.g. CREATE SCHEMA IF NOT EXISTS auth;
  # CREATE TABLE auth.users (...); — one migration history, not one per
  # module, per ADR-001 §3's single-database decision), then exits. Re-run
  # any time with `docker compose run --rm migrate`. This service itself
  # doesn't change across phases — it just picks up whatever's newest under
  # backend/migrations/ as later phases add meetup/billing schema files.
  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/monolith_db?sslmode=disable"
      - "up"

  monolith:
    build:
      context: .
      dockerfile: cmd/monolith/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${MONOLITH_HOST_PORT:-9090}:9090" # gRPC — not exposed publicly in production, only opened here for local debugging; the gateway is the one public entry point
    environment:
      MONOLITH_PORT: 9090
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/monolith_db?sslmode=disable
      # --- auth module config (Phase 1) — same names/fallback behavior as
      # the sibling repo's services/auth/internal/config/config.go. Empty
      # Twilio/Gmail/Resend values fall back to logging senders, same as
      # there; empty Apple/Google audience values make those identity
      # providers fail closed rather than block startup.
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
      LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI}
      APPLE_SERVICES_ID: ${APPLE_SERVICES_ID}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      GMAIL_ADDRESS: ${GMAIL_ADDRESS}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      WORK_EMAIL_HMAC_KEY_PATH: /secrets/work_email_hmac.key
      # Testing-only OTP bypass — see TESTING-NOTES.md. MUST be forwarded
      # explicitly like this: a value in backend/.env is only used to
      # INTERPOLATE into this file, and never reaches a container unless it is
      # named here. Without this line the flag looked enabled (it was set in
      # .env) while the monolith never saw it, so "123456" was silently
      # rejected and the loud startup warning that is supposed to make this
      # impossible to miss never fired either.
      #
      # Empty default, not `:?`: absent means OFF, which is the only safe
      # direction for a flag that weakens authentication. The monolith logs a
      # WARN on every startup while it is set to "true".
      ALLOW_TEST_OTP_BYPASS: ${ALLOW_TEST_OTP_BYPASS:-}
      # Shared secret the monolith requires on every incoming gRPC call
      # (ADR-001's 2026-09-04 correction). Same .env value as the gateway's
      # MONOLITH_SHARED_SECRET below — one source, so they can't drift.
      INTERNAL_GRPC_SHARED_SECRET: ${INTERNAL_GRPC_SHARED_SECRET:?set INTERNAL_GRPC_SHARED_SECRET in backend/.env — see .env.example}
      # --- meetup module config (Phase 2 — add here when built, don't wire early) ---
      # --- billing module config (Phase 3 — add here when built) ---
      # Notification module (Phase 4, pulled forward 2026-09-04 — see
      # docs/plans/03-hardening-pass.md §E). Raw JSON content of a downloaded
      # Firebase service-account key, not a file path. Optional, same
      # empty-means-fallback pattern as Twilio/Resend/Gmail above — empty
      # means LoggingPushSender, a real value means FCMPushSender.
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
    volumes:
      - ./secrets:/secrets:ro
    mem_limit: 1g
    cpus: 2.0
    # §D1. `monolith -healthcheck` is a mode of the same binary (see
    # cmd/monolith/healthcheck.go) — the runtime image is distroless, so
    # there is no shell for CMD-SHELL and no curl, and adding a
    # grpc-health-probe binary would mean another third-party artifact to
    # pin and patch for something this binary already does.
    #
    # start_period covers startup work (pool warm-up, Apple/Google JWKS
    # fetches) during which failures do not count against retries, so a
    # slow-but-healthy start is not mistaken for a crash loop.
    healthcheck:
      test: ["CMD", "/monolith", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  gateway:
    build:
      context: .
      dockerfile: cmd/gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      # service_healthy, not service_started (§D1). service_started only
      # confirms the container process launched — the gateway could then
      # start accepting traffic while the monolith was still warming up its
      # pool and fetching JWKS, and every request in that window failed for
      # no reason a user could understand. The healthcheck above is what
      # makes this condition mean "actually able to serve".
      monolith:
        condition: service_healthy
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    environment:
      PORT: 8080
      MONOLITH_ADDR: monolith:9090
      # Gateway holds BOTH JWT keys now (ADR-001 §6) — it signs new tokens
      # (private key) and verifies bearer tokens on every subsequent request
      # (public key). The monolith never sees the private key at all.
      JWT_PRIVATE_KEY_PATH: /secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /secrets/jwt_public.pem
      # The other half of the internal gRPC authentication — the same value
      # the monolith verifies against (see its
      # INTERNAL_GRPC_SHARED_SECRET above).
      MONOLITH_SHARED_SECRET: ${INTERNAL_GRPC_SHARED_SECRET:?set INTERNAL_GRPC_SHARED_SECRET in backend/.env — see .env.example}
      # Public keys from a signing key that has been rotated out but whose
      # tokens may still be in flight (§A3). Normally empty — set only for
      # the deploy that performs a rotation, then removed. Comma-separated;
      # see backend/secrets/README.md for the procedure.
      JWT_PREVIOUS_PUBLIC_KEY_PATHS: ${JWT_PREVIOUS_PUBLIC_KEY_PATHS:-}
      # No REDIS_ADDR — rate limiting is in-memory, single gateway instance
      # (ADR-001 §5's explicit, accepted trade-off).
    volumes:
      - ./secrets:/secrets:ro
    mem_limit: 512m
    cpus: 1.0
    # §D3. Liveness only — /healthz never consults the monolith, on purpose:
    # a monolith outage answering this endpoint with a failure would get
    # every gateway replica restarted, turning a recoverable downstream
    # problem into a full one. /readyz is the endpoint that checks the
    # dependency, and it is for routing decisions, not restarts.
    healthcheck:
      test: ["CMD", "/gateway", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
