# gitleaks configuration (#95). The default rules, plus an allowlist of the
# findings reviewed on 2026-10-22 — each a false positive for the reason
# given. Anything else gitleaks finds fails CI.

[extend]
useDefault = true

[[allowlists]]
description = "Firebase client config: public by design, shipped inside every app binary and restricted by Firebase rules and API-key restrictions, not by secrecy"
paths = [
  '''frontend/lib/firebase_options\.dart''',
  '''frontend/android/app/google-services\.json''',
  '''frontend/ios/Runner/GoogleService-Info\.plist''',
  '''frontend/macos/Runner/GoogleService-Info\.plist''',
]

[[allowlists]]
description = "CocoaPods lockfile checksums, which match the generic key pattern"
paths = [
  '''Podfile\.lock''',
]

[[allowlists]]
description = "A made-up account token in one purchase test, reviewed 2026-11-04: a fixed UUID with no account behind it, and the app sends it to no one"
condition = "AND"
paths = [
  '''frontend/test/purchase_flow_controller_test\.dart''',
]
regexTarget = "match"
regexes = [
  '''accountToken: '86c0ac9d-aaeb-55cd-b903-7c60e6c93b6e'''',
]
